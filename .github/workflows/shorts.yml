name: AI Shorts Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: ai-shorts-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Whisper cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-v1

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade "yt-dlp[default]"

      - name: Check tools
        run: |
          echo "Python:"
          python --version
          echo ""
          echo "yt-dlp:"
          yt-dlp --version
          echo ""
          echo "ffmpeg:"
          ffmpeg -version | head -n 1

      - name: Prepare input
        run: |
          mkdir -p input
          mkdir -p output
          mkdir -p output/clips
          rm -f input/source.mp4
          rm -f input/source.json
          rm -f output/source_audio.wav
          echo "Folders prepared"

      - name: Find and download RUTUBE video
        run: |
          python main.py --download

      - name: Check downloaded video
        run: |
          if [ ! -f "input/source.mp4" ]; then
            echo "ERROR: input/source.mp4 was not created"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SOURCE VIDEO"
          echo "======================================"
          ls -lh input/source.mp4
          echo ""
          echo "VIDEO INFORMATION"
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            input/source.mp4

      - name: Run AI
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python main.py --process

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: |
            output/short.mp4
            output/thumbnail.jpg
            output/clips/*.mp4
            output/source_audio.wav
          if-no-files-found: warn
