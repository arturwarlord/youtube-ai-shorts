name: AI Shorts Generator

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "YouTube search query"
        required: false
        default: "viral podcast interview"
        type: string

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"


jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Download project
        uses: actions/checkout@v4


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Install Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      # ==========================================================
      # DENO
      # ==========================================================

      - name: Install Deno
        uses: denoland/setup-deno@v2

        with:
          deno-version: v2.x


      # ==========================================================
      # FFMPEG
      # ==========================================================

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==========================================================
      # WHISPER CACHE
      # ==========================================================

      - name: Cache Whisper model
        uses: actions/cache@v4

        with:
          path: ~/.cache/whisper
          key: whisper-tiny-v1


      # ==========================================================
      # PYTHON PACKAGES
      # ==========================================================

      - name: Install packages
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install --upgrade "yt-dlp[default]"


      # ==========================================================
      # SHOW VERSIONS
      # ==========================================================

      - name: Check tools
        run: |

          python --version

          yt-dlp --version

          deno --version

          ffmpeg -version | head -n 1


      # ==========================================================
      # DIRECTORIES
      # ==========================================================

      - name: Prepare input
        run: |

          mkdir -p input
          mkdir -p output
          mkdir -p output/clips

          rm -f input/source.mp4


      # ==========================================================
      # SEARCH + DOWNLOAD
      # ==========================================================

      - name: Find and download source video

        env:

          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          SEARCH_QUERY: ${{ inputs.search_query }}

        run: |

          python main.py --download


      # ==========================================================
      # CHECK SOURCE
      # ==========================================================

      - name: Check downloaded video

        run: |

          if [ ! -f "input/source.mp4" ]; then

            echo "ERROR: input/source.mp4 was not created"

            exit 1

          fi


          echo ""

          echo "Source video:"

          ls -lh input/source.mp4


          echo ""

          echo "Video information:"


          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            input/source.mp4


      # ==========================================================
      # AI SHORTS
      # ==========================================================

      - name: Run AI

        env:

          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}

          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}

        run: |

          python main.py --process


      # ==========================================================
      # SAVE RESULTS
      # ==========================================================

      - name: Save generated files

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: youtube-short

          path: |

            output/short.mp4
            output/thumbnail.jpg

            output/clips/*.mp4

            output/source_audio.wav

          if-no-files-found: warn
