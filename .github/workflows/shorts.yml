name: AI Shorts Generator

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "YouTube URL of the long video"
        required: true
        type: string

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"

jobs:
  generate-shorts:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ------------------------------------------------------
      # 3. FFmpeg
      # ------------------------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ------------------------------------------------------
      # 4. Whisper cache
      # ------------------------------------------------------

      - name: Cache Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-v1

      # ------------------------------------------------------
      # 5. Python dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 6. Create directories
      # ------------------------------------------------------

      - name: Prepare directories
        run: |
          mkdir -p input
          mkdir -p output/clips

      # ------------------------------------------------------
      # 7. Download source video
      # ------------------------------------------------------

      - name: Download source video
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          yt-dlp \
            --no-playlist \
            --merge-output-format mp4 \
            -f "bv*[height<=1080]+ba/b[height<=1080]" \
            -o "input/source.%(ext)s" \
            "$SOURCE_URL"

          echo "Downloaded files:"
          ls -lh input/

      # ------------------------------------------------------
      # 8. Check source
      # ------------------------------------------------------

      - name: Check source video
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ls -lh input/source.*
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            input/source.mp4

      # ------------------------------------------------------
      # 9. Run AI Shorts pipeline
      # ------------------------------------------------------

      - name: Generate Shorts
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          python main.py

      # ------------------------------------------------------
      # 10. Upload generated Shorts as artifacts
      # ------------------------------------------------------

      - name: Upload generated Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: |
            output/clips/*.mp4
            output/source_audio.wav
          if-no-files-found: warn
