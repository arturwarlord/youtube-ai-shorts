name: AI Shorts Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # =====================================================
      # 1. Download project
      # =====================================================

      - name: Download project
        uses: actions/checkout@v4

      # =====================================================
      # 2. Python
      # =====================================================

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =====================================================
      # 3. FFmpeg
      # =====================================================

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =====================================================
      # 4. Whisper cache
      # =====================================================

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-tiny-v1

      # =====================================================
      # 5. Python packages
      # =====================================================

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade "yt-dlp[default]"

      # =====================================================
      # 6. Check tools
      # =====================================================

      - name: Check tools
        run: |
          echo "Python:"
          python --version

          echo ""
          echo "yt-dlp:"
          yt-dlp --version

          echo ""
          echo "ffmpeg:"
          ffmpeg -version | head -n 1

      # =====================================================
      # 7. Prepare folders
      # =====================================================

      - name: Prepare input
        run: |
          mkdir -p input
          mkdir -p output
          mkdir -p output/clips

          rm -f input/source.mp4
          rm -f output/source_audio.wav

          echo "Folders prepared"

      # =====================================================
      # 8. Download RUTUBE source
      # =====================================================

      - name: Find and download RUTUBE video
        run: |
          python main.py --download

      # =====================================================
      # 9. Check source video
      # =====================================================

      - name: Check downloaded video
        run: |
          if [ ! -f "input/source.mp4" ]; then
            echo "ERROR: input/source.mp4 was not created"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SOURCE VIDEO"
          echo "======================================"

          ls -lh input/source.mp4

          echo ""
          echo "VIDEO INFORMATION"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            input/source.mp4

      # =====================================================
      # 10. AI processing
      # =====================================================

      - name: Run AI
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python main.py --process

      # =====================================================
      # 11. Save generated files
      # =====================================================

      - name: Save generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: |
            output/short.mp4
            output/thumbnail.jpg
            output/clips/*.mp4
            output/source_audio.wav
          if-no-files-found: warn
